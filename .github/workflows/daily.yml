name: daily-index-contribution

on:
  schedule:
    # הרצות "עוגן" (שעון ישראל). GitHub מעכב אותן בשעות, לכן יש כמה — הראשונה שמתחילה
    # ממתינה בעצמה לסגירה בארה"ב ומחזיקה את עצמה בחיים עד המסירה (ריצות המשך).
    - cron: "0 18 * * 1-5"
      timezone: "Asia/Jerusalem"
    - cron: "30 20 * * 1-5"
      timezone: "Asia/Jerusalem"
    - cron: "45 22 * * 1-5"
      timezone: "Asia/Jerusalem"
    # רשת ביטחון בלילה/בוקר אם השרשרת נפלה
    - cron: "30 2 * * 2-6"
      timezone: "Asia/Jerusalem"
    - cron: "30 5 * * 2-6"
      timezone: "Asia/Jerusalem"
  workflow_dispatch:
    inputs:
      mode:
        description: "now = מסירה מיידית · auto = לפי חלונות הזמן (משמש לריצות המשך)"
        type: choice
        options: [now, auto]
        default: now
      date:
        description: "תאריך (YYYY-MM-DD), ריק = יום המסחר האחרון (רק ב-now)"
        required: false
      email:
        description: "לשלוח מייל?"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write     # להפעלת ריצת המשך

# הרצות רצות בזו אחר זו; הרצה שממתינה בתור כשהשרשרת חיה — מסיימת בשנייה (אין מה לעשות)
concurrency:
  group: daily-index-contribution
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          git config user.name  "index-agent"
          git config user.email "index-agent@users.noreply.github.com"

      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "auto" ]; then
            ARGS="--now"
            [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.email }}" = "false" ]; then
            ARGS="$ARGS --no-email"
          fi
          python -u run_daily.py $ARGS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: |
            docs/index.html
            out/*.png
          if-no-files-found: ignore
