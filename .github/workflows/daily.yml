name: daily-index-contribution

on:
  schedule:
    # ימי ב'–ו' (ראשון–חמישי UTC) 04:17 UTC ≈ 07:17 שעון ישראל בקיץ / 06:17 בחורף
    # מציג את יום המסחר האחרון שנסגר (ביום שני: נתוני שישי)
    - cron: "17 4 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "תאריך (YYYY-MM-DD), ריק = יום המסחר האחרון"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-index-contribution
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python agent.py --date "${{ github.event.inputs.date }}"
          else
            python agent.py
          fi

      - name: Commit dashboard
        run: |
          git config user.name  "index-agent"
          git config user.email "index-agent@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "dashboard $(ls -t docs/data | head -1 | cut -d. -f1)"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: docs/index.html
