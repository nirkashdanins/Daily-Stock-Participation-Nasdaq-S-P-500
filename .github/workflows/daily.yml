name: daily-index-contribution

on:
  schedule:
    # ימי ב'–ו' (ראשון–חמישי UTC) 04:17 UTC ≈ 07:17 שעון ישראל בקיץ / 06:17 בחורף
    # מציג את יום המסחר האחרון שנסגר (ביום שני: נתוני שישי)
    - cron: "17 4 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "תאריך (YYYY-MM-DD), ריק = יום המסחר האחרון"
        required: false
      email:
        description: "לשלוח מייל?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-index-contribution
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          python -u agent.py $ARGS 2>&1 | tee run.log || {
            tail -n 25 run.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          grep -E "סכום|אזהרה" run.log | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Commit dashboard
        run: |
          git config user.name  "index-agent"
          git config user.email "index-agent@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "dashboard $(ls -t docs/data | head -1 | cut -d. -f1)"
          git push

      - name: Snapshot dashboard (phone layout)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python snapshot.py

      - name: Send email
        if: github.event_name == 'schedule' || github.event.inputs.email == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python send_mail.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: |
            docs/index.html
            out/*.png
