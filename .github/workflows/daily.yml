name: daily-index-contribution

on:
  schedule:
    # שעון ישראל קבוע (GitHub מטפל במעבר קיץ/חורף). ג'–שבת = אחרי סגירת ב'–ו' בארה"ב.
    # 00:50 מחשב ושומר · 01:20 ממתין ל-07:00 ומוסר · 04:10 גיבוי
    - cron: "50 0 * * 2-6"
      timezone: "Asia/Jerusalem"
    - cron: "20 1 * * 2-6"
      timezone: "Asia/Jerusalem"
    - cron: "10 4 * * 2-6"
      timezone: "Asia/Jerusalem"
  workflow_dispatch:
    inputs:
      date:
        description: "תאריך (YYYY-MM-DD), ריק = יום המסחר האחרון"
        required: false
      email:
        description: "לשלוח מייל?"
        type: boolean
        default: true

permissions:
  contents: write

# ההרצות רצות בזו אחר זו: בזמן שהרצת 01:20 ממתינה, הרצת 04:10 מחכה בתור כגיבוי
concurrency:
  group: daily-index-contribution
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          git config user.name  "index-agent"
          git config user.email "index-agent@users.noreply.github.com"

      - name: Run
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--now"
            [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
            [ "${{ github.event.inputs.email }}" = "true" ] || ARGS="$ARGS --no-email"
          else
            ARGS=""
          fi
          python -u run_daily.py $ARGS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: |
            docs/index.html
            out/*.png
          if-no-files-found: ignore
